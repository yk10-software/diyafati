    <div class="install" id="installBar" hidden>
      <img src="icons/icon-192.png" alt="">

      <button class="btn-sm" id="installBtn">تثبيت</button>
      <button class="x" id="installClose" aria-label="إخفاء">×</button>
    </div>

    <label class="search">
      <span class="visually-hidden">ابحث عن صنف</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="ابحث عن صنف" autocomplete="off">
    </label>

    <div class="chips" id="chips" role="toolbar" aria-label="الأقسام"></div>

    <main class="grid" id="grid" aria-live="polite"></main>

    <section class="reviews" id="reviews" aria-labelledby="rvTitle" hidden>
      <h2 id="rvTitle">آراء الزباين</h2>
      <div class="rv-list" id="rvList"></div>
    </section>

    <footer class="footer">
      <img src="img/logo-full.png" alt="ضيافتي" width="60" height="72">
      <div class="socials" id="socials"></div>
      <p><a href="privacy.html">سياسة الخصوصية</a></p>
