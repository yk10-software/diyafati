<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدخال الأصناف · ضيافتي</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="../icons/favicon-64.png">
  <link rel="stylesheet" href="../styles.css?v=22">
  <link rel="stylesheet" href="import.css">
</head>
<body>
  <main class="imp">
    <header class="imp-head">
      <h1>إدخال الأصناف</h1>
      <button class="link-btn" type="button" id="logout" hidden>تسجيل خروج</button>
    </header>

    <p class="imp-note" id="status">لحظة...</p>

    <!-- الدخول بحساب الأدمن متل اللوحة -->
    <form id="login" novalidate hidden>
      <label class="field" data-f="email">
        <span>الإيميل</span>
        <input name="email" type="email" autocomplete="username" dir="ltr">
        <span class="err">اكتب الإيميل.</span>
      </label>
      <label class="field" data-f="password">
        <span>كلمة السر</span>
        <input name="password" type="password" autocomplete="current-password" dir="ltr">
        <span class="err">اكتب كلمة السر.</span>
      </label>
      <p class="form-msg" id="loginMsg" role="alert"></p>
      <button class="btn" type="submit">دخول</button>
    </form>

    <section id="pick" hidden>
      <label class="field">
        <span>ملف الأصناف (zip)</span>
        <input type="file" id="zip" accept=".zip,application/zip">
      </label>
      <p class="form-msg" id="zipMsg" role="alert"></p>
    </section>

    <section id="review" hidden>
      <p class="imp-sum" id="sum"></p>

      <h2>الأقسام</h2>
      <div id="catOpts"></div>
      <div class="imp-wrap"><table id="cats"></table></div>

      <h2>النسخة التجريبية</h2>
      <div id="demo"></div>

      <h2>الأصناف</h2>
      <div class="imp-wrap"><table id="prods"></table></div>

      <div class="imp-bar">
        <button class="btn" type="button" id="run"></button>
      </div>
    </section>

    <section id="progress" hidden>
      <h2>عم ندخل الأصناف</h2>
      <div class="imp-track"><i id="bar"></i></div>
      <p class="imp-note" id="step"></p>
    </section>

    <section id="done" hidden>
      <h2>الملخص</h2>
      <ul id="report"></ul>
      <p class="form-msg" id="doneMsg"></p>
      <button class="btn" type="button" id="again">رجوع للمراجعة</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"
          integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
          integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG"
          crossorigin="anonymous"></script>
  <script src="../config.js"></script>
  <script src="../supa.js"></script>
  <script src="../data.js"></script>
  <script src="import.js"></script>
</body>
</html>
