<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لوحة تحكم ضيافتي</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F9F7A4">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <div class="app admin">
    <header class="topbar">
      <a class="brand" href="./" aria-label="فتح التطبيق">
        <img class="mark" src="img/logo-mark.png" alt="" width="38" height="40">
        <img class="word" src="img/logo-word.png" alt="ضيافتي" width="97" height="26">
      </a>
      <div class="top-actions">
        <button class="btn-sm ghost" id="accountBtn" hidden>حسابي</button>
        <a class="btn-sm as-link" href="./">فتح التطبيق</a>
      </div>
    </header>

    <!-- لحظة التحقق من الجلسة -->
    <p class="gate-note" id="booting">لحظة...</p>

    <!-- الدخول -->
    <section class="gate" id="gate" hidden>
      <img src="img/logo-full.png" alt="" width="100" height="120">
      <h1>لوحة التحكم</h1>

      <form id="loginForm" novalidate>
        <label class="field" data-f="email">
          <span>الإيميل</span>
          <input name="email" type="email" autocomplete="username" dir="ltr" inputmode="email">
          <span class="err">اكتب الإيميل.</span>
        </label>
        <label class="field" data-f="password">
          <span>كلمة السر</span>
          <input name="password" type="password" autocomplete="current-password" dir="ltr">
          <span class="err">اكتب كلمة السر.</span>
        </label>
        <p class="form-msg" id="loginMsg" role="alert"></p>
        <button class="btn" type="submit">دخول</button>
        <button class="link-btn gate-link" type="button" id="forgotLink">نسيت كلمة السر؟</button>
      </form>

      <form id="forgotForm" novalidate hidden>
        <p class="gate-note">اكتب إيميلك، ومنبعتلك رابط لتعيين كلمة سر جديدة.</p>
        <label class="field" data-f="email">
          <span>الإيميل</span>
          <input name="email" type="email" autocomplete="username" dir="ltr" inputmode="email">
          <span class="err">اكتب الإيميل.</span>
        </label>
        <p class="form-msg" id="forgotMsg" role="alert"></p>
        <button class="btn" type="submit">ابعتلي الرابط</button>
        <button class="link-btn gate-link" type="button" id="backLink">رجوع لتسجيل الدخول</button>
      </form>
    </section>

    <!-- اللوحة -->
    <section id="panel" hidden>
      <div class="a-head">
        <h1>أصناف المحل</h1>
        <p id="summary"></p>
      </div>
      <p class="demo-note" id="demoNote">الأصناف بهالشاشة لسا محفوظة على هالجهاز بس. بالخطوة الجاية بتنربط بـ Supabase وبيوصل أي تعديل لكل الزباين.</p>
      <div class="a-tools">
        <button class="btn" id="addBtn">إضافة صنف</button>
        <label class="search">
          <span class="visually-hidden">ابحث عن صنف</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="aSearch" placeholder="ابحث عن صنف" autocomplete="off">
        </label>
      </div>
      <div id="list" class="a-list"></div>
      <div class="a-foot">
        <button class="link-btn" id="resetBtn">رجّع الأصناف الأصلية</button>
      </div>
    </section>
  </div>

  <!-- supabase-js بنسخة مثبّتة، والـ integrity بيمنع المتصفح يشغّلها إذا تغيّر الملف -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"
          integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp"
          crossorigin="anonymous"></script>
  <script src="config.js?v=6"></script>
  <script src="supa.js?v=6"></script>
  <script src="data.js?v=6"></script>
  <script src="admin.js?v=6"></script>
</body>
</html>
