# إعدادات موقع التجربة diyafati-dev على Netlify
# موقع ثابت بلا build: الملفات بتنرفع متل ما هي من جذر الريبو.
[build]
  publish = "."

# ⚠ حماية الرصيد: كل production deploy ناجح بـ 15 رصيد، والفاشل ببلاش.
# فرع dev لازم يضل branch deploy (ببلاش). إذا بالغلط صار dev فرع production،
# البناء بيفشل بدل ما ياكل رصيد مع كل رفعة.
# وقت الإطلاق الحقيقي لازم ينشال هالقسم من الفرع اللي رح ينرفع.
[context.production]
  command = "echo 'production deploy ممنوع على dev، شوف CLAUDE.md' && exit 1"

# حماية عامة لكل الصفحات (من فحص ما قبل الإطلاق):
# nosniff: المتصفح ما بيخمّن نوع الملف. frame-ancestors: ما حدا بيحط الموقع جوا موقع تاني.
# Referrer-Policy: ما منبعت الرابط الكامل لمواقع تانية. Permissions-Policy: ما منطلب كاميرا ولا مايك ولا موقع.
# ما في script-src بالـ CSP لأنو في سكربتات صغيرة جوا admin.html و privacy.html و reset.html.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    Strict-Transport-Security = "max-age=31536000"

# الـ service worker لازم ما ينحفظ بالكاش، وإلا التحديثات ما بتوصل للموبايلات
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# ملفات الشغل ما إلها علاقة بالتطبيق، فما منقدّمها عالموقع
[[redirects]]
  from = "/CLAUDE.md"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/design/*"
  to = "/not-found"
  status = 404
  force = true
