# إعدادات موقع التجربة diyafati-dev على Netlify
# موقع ثابت بلا build: الملفات بتنرفع متل ما هي من جذر الريبو.
[build]
  publish = "."

# ⚠ حماية الرصيد: كل production deploy ناجح بـ 15 رصيد، والفاشل ببلاش.
# فرع dev لازم يضل branch deploy (ببلاش). إذا بالغلط صار dev فرع production،
# البناء بيفشل بدل ما ياكل رصيد مع كل رفعة.
# وقت الإطلاق الحقيقي لازم ينشال هالقسم من الفرع اللي رح ينرفع.
[context.production]
  command = "echo 'production deploy ممنوع على dev، شوف CLAUDE.md' && exit 1"

# الـ service worker لازم ما ينحفظ بالكاش، وإلا التحديثات ما بتوصل للموبايلات
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# ملفات الشغل ما إلها علاقة بالتطبيق، فما منقدّمها عالموقع
[[redirects]]
  from = "/CLAUDE.md"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/not-found"
  status = 404
  force = true

[[redirects]]
  from = "/design/*"
  to = "/not-found"
  status = 404
  force = true
