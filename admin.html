<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لوحة تحكم ضيافتي</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F9F7A4">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="manifest" href="admin.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="لوحة ضيافتي">
  <link rel="stylesheet" href="styles.css?v=18">
</head>
<body>
  <!-- الأيقونات (من design/panel.html) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1v-8.5Z"/></symbol>
    <symbol id="i-orders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1Z"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.5-.3Z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5v-9Z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></symbol>
  </svg>

  <div class="app admin">
    <header class="topbar">
      <a class="brand" href="./" aria-label="فتح التطبيق">
        <img class="mark" src="img/logo-mark.png" alt="" width="38" height="40">
        <img class="word" src="img/logo-word.png" alt="ضيافتي" width="97" height="26">
      </a>
      <a class="btn-sm as-link" href="./">فتح التطبيق</a>
    </header>

    <!-- لحظة التحقق من الجلسة -->
    <p class="gate-note" id="booting">لحظة...</p>

    <!-- الدخول -->
    <section class="gate" id="gate" hidden>
      <img src="img/logo-full.png" alt="" width="100" height="120">
      <h1>لوحة التحكم</h1>

      <form id="loginForm" novalidate>
        <label class="field" data-f="email">
          <span>الإيميل</span>
          <input name="email" type="email" autocomplete="username" dir="ltr" inputmode="email">
          <span class="err">اكتب الإيميل.</span>
        </label>
        <label class="field" data-f="password">
          <span>كلمة السر</span>
          <input name="password" type="password" autocomplete="current-password" dir="ltr">
          <span class="err">اكتب كلمة السر.</span>
        </label>
        <p class="form-msg" id="loginMsg" role="alert"></p>
        <button class="btn" type="submit">دخول</button>
        <button class="link-btn gate-link" type="button" id="forgotLink">نسيت كلمة السر؟</button>
      </form>

      <form id="forgotForm" novalidate hidden>
        <p class="gate-note">اكتب إيميلك، ومنبعتلك رابط لتعيين كلمة سر جديدة.</p>
        <label class="field" data-f="email">
          <span>الإيميل</span>
          <input name="email" type="email" autocomplete="username" dir="ltr" inputmode="email">
          <span class="err">اكتب الإيميل.</span>
        </label>
        <p class="form-msg" id="forgotMsg" role="alert"></p>
        <button class="btn" type="submit">ابعتلي الرابط</button>
        <button class="link-btn gate-link" type="button" id="backLink">رجوع لتسجيل الدخول</button>
      </form>
    </section>

    <!-- اللوحة: هيدر الشاشة + المحتوى + الشريط تحت -->
    <section id="panel" hidden>
      <header class="p-head">
        <img src="img/logo-mark.png" alt="" width="38" height="40">
        <div><h1 id="pTitle"></h1><small id="pSub"></small></div>
      </header>
      <main id="view" class="p-body"></main>
      <nav class="a-nav" aria-label="أقسام اللوحة">
        <button type="button" data-go="home"><svg aria-hidden="true"><use href="#i-home"/></svg>الرئيسية</button>
        <button type="button" data-go="orders"><svg aria-hidden="true"><use href="#i-orders"/></svg>الطلبات<span class="a-dot" id="navNew" hidden></span></button>
        <button type="button" data-go="products"><svg aria-hidden="true"><use href="#i-box"/></svg>الأصناف</button>
        <button type="button" data-go="categories"><svg aria-hidden="true"><use href="#i-grid"/></svg>الأقسام</button>
        <button type="button" data-go="settings"><svg aria-hidden="true"><use href="#i-gear"/></svg>الإعدادات</button>
      </nav>
    </section>
  </div>

  <!-- supabase-js بنسخة مثبّتة، والـ integrity بيمنع المتصفح يشغّلها إذا تغيّر الملف -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"
          integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp"
          crossorigin="anonymous"></script>
  <script src="config.js?v=18"></script>
  <script src="supa.js?v=18"></script>
  <script src="data.js?v=18"></script>
  <script src="admin.js?v=18"></script>
  <script src="admin-home.js?v=18"></script>
  <script src="admin-orders.js?v=18"></script>
  <script src="admin-coupons.js?v=18"></script>
  <script src="admin-products.js?v=18"></script>
  <script src="admin-categories.js?v=18"></script>
  <script src="admin-stories.js?v=18"></script>
  <script src="admin-reviews.js?v=18"></script>
  <script src="admin-help.js?v=18"></script>
  <script src="admin-push.js?v=18"></script>
  <script src="admin-settings.js?v=18"></script>
  <script>
    // الشريط تحت: كل زر بيفتح شاشته
    document.querySelector('.a-nav').addEventListener('click', e => {
      const b = e.target.closest('[data-go]');
      if (b) location.hash = b.dataset.go;
    });
  </script>
</body>
</html>
